# Layer 1 of the test plan (docs/testing/test-matrix.md): runs on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, scenarios, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Also validates that gradle-wrapper.jar is a genuine Gradle release.
      - uses: gradle/actions/setup-gradle@v4

      - name: Scenario and unit tests
        run: ./gradlew :core:domain:test testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: "Privacy invariant: no INTERNET permission"
        run: |
          manifest=$(find app/build/intermediates -path '*merged_manifest*' -path '*debug*' -name AndroidManifest.xml | head -n 1)
          if [ -z "$manifest" ]; then
            echo "::error::Merged manifest not found"; exit 1
          fi
          echo "Checking $manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The merged manifest declares android.permission.INTERNET. UnderTone must never have network access (docs/adr/0003-no-internet-permission.md)."
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: undertone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ktlint:
    name: Code style (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KTLINT_VERSION: "1.7.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run ktlint
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          # Exclude build/: Room's generated DAOs are not ours to style.
          ./ktlint "**/*.kt" "**/*.kts" "!**/build/**"
