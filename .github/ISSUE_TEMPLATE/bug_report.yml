name: Bug report
description: Something UnderTone did differently from what you expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did UnderTone do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Setup and steps
      description: Active profile, the app or caller involved, its level and hours, any calendar rule or override, and the time it happened.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Redmi Note 14 Pro, HyperOS 2, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UnderTone version
      placeholder: Settings → About
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic log (optional)
      description: Health check → Export diagnostic log. It contains app package names and decisions, never notification content.
